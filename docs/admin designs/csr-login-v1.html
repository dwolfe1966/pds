<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>CSR Login</title>
  <link rel='stylesheet' href='style.css'>
  <style>.login-page{display:flex;height:calc(100vh - 60px);} .login-container{display:flex;flex:1;} .login-form{flex:1;padding:4rem;background:#f7fafc;} .login-hero{flex:1;background:url('https://images.pexels.com/photos/373543/pexels-photo-373543.jpeg') center/cover no-repeat;} .remember{margin:0.5rem 0;} .login-form input{display:block;width:100%;padding:0.6rem;margin-bottom:0.6rem;border:1px solid #ccd5d9;border-radius:4px;} .login-form button{width:100%;}</style>
</head>
<body>
<header>  <div class='container nav-container'>    <div class='logo'>IDLookup Admin</div>    <nav>      <ul class='nav-links'>        <li><a href='#'>Info</a></li>        <li><a href='#'>Emails</a></li>        <li><a href='#'>Customers</a></li>        <li><a href='#'>OptOut</a></li>      </ul>    </nav>  </div></header>
<main class='login-page'>  <div class='login-container'>    <div class='login-form'>      <h1>CSR App Login</h1>      <input type='text' placeholder='Username'>      <input type='password' placeholder='Password'>      <label class='remember'><input type='checkbox'> Remember Me</label>      <button class='primary-btn'>Login</button>    </div>    <div class='login-hero'></div>  </div></main>
<footer>  <div class='container footer-content'>    <p>IDLookup.ai © 2025. Internal use only.</p>  </div></footer>
