# Off-request inmate-roster crawler (the moat asset).
#
# WHY THIS EXISTS: as of 2026-07-19 most states are covered LIVE (direct JSON/HTML/bulk + the free VINE guest
# API, which now covers NY/NJ/KY/CT/NH/TN/WV/MN/RI/VA/NM/MT + a universal fallback) and need NO crawling. This
# crawler is ONLY for the remaining "rich" async-tier states — TX,MI,AZ (Browserless) + OK,KS,WI,CO (2Captcha)
# — which carry MUGSHOTS/CHARGES that VINE lacks and take 15–120s/query. Vercel's per-request after() gets killed
# before they finish, so this job runs the crawler (seo/scripts/crawl-state-inmates.mjs) with a 6h budget,
# decoupled from requests, upserting into the `inmates` table; live searches serve those states from the DB.
#
# COST: only these 7 states cost money (Browserless / 2Captcha ~$0.001-0.003/query). VINE states are $0 and live.
# The schedule is intentionally DISABLED — enable it (per-state cadence, owner-defined) after OK'ing the spend.
# Until then, run on demand from the Actions tab. (2Captcha is now optional — drop OK/KS/WI/CO to VINE to cut it.)
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   DATABASE_URL         Neon connection string (the `inmates` table)
#   BROWSER_SERVICE_URL  Browserless /function endpoint incl. ?token=…  (TX/MI/RI)
#   CAPTCHA_SOLVER_KEY   2Captcha API key                               (VA and other captcha states)
#   STATE_PROXY_URL      (optional) residential proxy for direct-fetch blocked states
name: Crawl inmate rosters

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'States to crawl into the inmates DB. Default = all CLOUD-CAPABLE (browser/captcha + VINE-API) states; direct-fetch DOC states are blocked from datacenter IPs so crawl those locally or set STATE_PROXY_URL.'
        default: 'NY,NJ,KY,CT,NH,TN,WV,MN,RI,VA,NM,MT,MO,TX,MI,AZ,OK,KS,WI,CO'
      surnames:
        description: 'Comma-separated surnames (blank = built-in top-50)'
        default: ''
      firstnames:
        description: 'First names for first×last states TX/MD/OR (blank = built-in top-20)'
        default: ''
      delay:
        description: 'Politeness delay between queries (ms)'
        default: '1200'
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC — refresh the cloud-capable states into the inmates DB (owner
                          # approved unlimited spend 2026-07-20). Direct-fetch states are crawled locally.

concurrency:
  group: crawl-inmates
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment: Production   # DATABASE_URL / BROWSER_SERVICE_URL / CAPTCHA_SOLVER_KEY live here, not at repo level
    timeout-minutes: 350
    defaults:
      run:
        working-directory: seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Crawl states
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BROWSER_SERVICE_URL: ${{ secrets.BROWSER_SERVICE_URL }}
          CAPTCHA_SOLVER_KEY: ${{ secrets.CAPTCHA_SOLVER_KEY }}
          STATE_PROXY_URL: ${{ secrets.STATE_PROXY_URL }}
          STATES: ${{ github.event.inputs.states || 'NY,NJ,KY,CT,NH,TN,WV,MN,RI,VA,NM,MT,MO,TX,MI,AZ,OK,KS,WI,CO' }}
          SURNAMES: ${{ github.event.inputs.surnames }}
          FIRSTNAMES: ${{ github.event.inputs.firstnames }}
          DELAY: ${{ github.event.inputs.delay || '1200' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is not set"; exit 1; fi
          IFS=',' read -ra ST <<< "$STATES"
          for s in "${ST[@]}"; do
            s=$(echo "$s" | tr -d ' ')
            [ -z "$s" ] && continue
            ARGS="--state=$s --delay=$DELAY"
            [ -n "$SURNAMES" ] && ARGS="$ARGS --surnames=$SURNAMES"
            [ -n "$FIRSTNAMES" ] && ARGS="$ARGS --firstnames=$FIRSTNAMES"
            echo "=== crawling $s ($ARGS) ==="
            node scripts/crawl-state-inmates.mjs $ARGS || echo "::warning::$s crawl failed (continuing)"
          done
