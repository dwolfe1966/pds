<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDLookup.AI</title>
  <!-- Google Tag Manager: per-host loader DISABLED 2026-06-10.
       BC's IIFE now injects comp.client.init.header, which loads the brand's GTM
       container (comp.brand.gtm) on every page. Our loader below was therefore
       DOUBLE-loading GTM (verified live: GTM-WV7N6WWP x2 on dev and peoplesearcher).
       Commented out so BC's injection is the single source. Re-enable this client-side
       per-host loader if BC ever stops injecting GTM via comp.client.init.header.
       (Separate issue to track: BC's container loaded WRONG on idlookup.ai and
       inmatefinderhub.com - they got the dev container GTM-WV7N6WWP x1, not their own.)
  <script>
    (function () {
      var host = (window.location.hostname || '').toLowerCase().replace(/^www\./, '');
      var GTM_IDS = {
        'idlookup.ai':         'GTM-THCSBJWN',
        'dev.www.idlookup.ai': 'GTM-WV7N6WWP',
        'peoplesearcher.ai':   'GTM-PBFRPKNX',
        'inmatefinderhub.com': 'GTM-TF6NWS79'
      };
      var gtmId = GTM_IDS[host];
      if (!gtmId) return;
      window.dataLayer = window.dataLayer || [];
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer',gtmId);
    })();
  </script>
  -->
  <!-- Google Ads conversion pixel (gtag.js, AW-18044069648) DISABLED 2026-06-10.
       Removed to avoid double-counting: the Ads conversion fires through BC's GTM
       container (loaded via comp.client.init.header). Re-enable below ONLY if the AW
       tag is NOT configured inside that GTM container.
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18044069648"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18044069648');
  </script>
  -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script src="https://dev.www.idlookup.ai/libs/api-wrapper/index.iife.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="../src/index.js"></script>
</body>

</html>
