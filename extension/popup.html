<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111827; }
  .hd { background: #0d5d2f; color: #fff; padding: 12px 16px; font-weight: 800; font-size: 14px; }
  .body { padding: 14px 16px; }
  .lead { font-size: 12px; color: #4b5563; line-height: 1.5; margin: 0 0 12px; }
  label { display: block; font-size: 11px; font-weight: 700; color: #374151; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .save { width: 100%; margin-top: 12px; background: #0d5d2f; color: #fff; border: none; border-radius: 9px; padding: 10px; font-size: 13.5px; font-weight: 800; cursor: pointer; }
  .status { font-size: 12px; color: #0d5d2f; font-weight: 700; margin-top: 8px; min-height: 15px; }
  .foot { font-size: 11px; color: #6b7280; margin-top: 10px; line-height: 1.45; }
  a { color: #0d5d2f; }
</style>
</head>
<body>
  <div class="hd">IDLookup Remove</div>
  <div class="body">
    <p class="lead">Your details fill broker opt-out forms automatically, in your own browser. Nothing is sent to us — this stays on your device.</p>
    <label>Full name</label><input id="name" placeholder="Jane A. Doe">
    <label>Email</label><input id="email" type="email" placeholder="jane@example.com">
    <label>Street address</label><input id="address" placeholder="123 Main St">
    <div class="row">
      <div><label>City</label><input id="city"></div>
      <div><label>State</label><input id="state" placeholder="CA"></div>
      <div><label>ZIP</label><input id="zip"></div>
    </div>
    <div class="row">
      <div><label>Phone</label><input id="phone"></div>
      <div><label>Date of birth</label><input id="dob" placeholder="MM/DD/YYYY"></div>
    </div>
    <button class="save" id="save">Save details</button>
    <div class="status" id="status"></div>
    <p class="foot">Open <a href="https://www.idlookup.ai/my-identity" target="_blank" rel="noopener">your footprint on IDLookup</a> to see everywhere your data lives. Signing in there syncs these details automatically.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
